name: Deploy (reports GitHub Deployment Status to Atlassian)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: production
    outputs:
      deployment_id: ${{ steps.create_deployment.outputs.deployment_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create deployment
        id: create_deployment
        uses: chrnorm/deployment-action@releases/v1
        with:
          token: ${{ github.token }}
          environment: production
      - name: Add summary content
        run: |
          echo "# Deployment Triggered 🚀" >> $GITHUB_STEP_SUMMARY
          echo "| Name | Result |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :----: |" >> $GITHUB_STEP_SUMMARY
          echo "| Status | **PENDING** |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy ID | ${{ steps.create_deployment.outputs.deployment_id }} |" >> $GITHUB_STEP_SUMMARY