name: Deploy on Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag name (e.g., v1.0.0)'
        required: true
        type: string

env:
  SERVICE_ID: ${{ vars.SERVICE_ID }}
  JIRA_URL: ${{ vars.JIRA_URL }}
  SERVICE_DESK_PROJECT_KEY: ${{ vars.SERVICE_DESK_PROJECT_KEY }}

jobs:
  create-deployment-and-jira-ticket:
    name: Create Deployment and Jira Ticket
    runs-on: ubuntu-latest
    permissions:
      deployments: write
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get Release Information
        id: release-info
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Manual trigger - fetch release info from GitHub API
            RELEASE_TAG="${{ inputs.release_tag }}"
            RESPONSE=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/releases/tags/${RELEASE_TAG}")
            
            RELEASE_URL=$(echo "$RESPONSE" | jq -r '.html_url')
            TAG_NAME=$(echo "$RESPONSE" | jq -r '.tag_name')
            
            if [ "$RELEASE_URL" = "null" ] || [ -z "$RELEASE_URL" ]; then
              echo "Failed to fetch release information for tag: $RELEASE_TAG"
              exit 1
            fi
            
            echo "release_tag=$TAG_NAME" >> $GITHUB_OUTPUT
            echo "release_url=$RELEASE_URL" >> $GITHUB_OUTPUT
          else
            # Automatic release trigger
            echo "release_tag=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
            echo "release_url=${{ github.event.release.html_url }}" >> $GITHUB_OUTPUT
          fi
          
          echo "Release Tag: $(cat $GITHUB_OUTPUT | grep release_tag | cut -d= -f2)"
          echo "Release URL: $(cat $GITHUB_OUTPUT | grep release_url | cut -d= -f2)"

      - name: Get Jira Cloud ID
        id: jira-cloud-id
        run: |
          # Fetch Cloud ID from unauthenticated endpoint
          RESPONSE=$(curl -s "${{ env.JIRA_URL }}/_edge/tenant_info")
          
          CLOUD_ID=$(echo $RESPONSE | jq -r '.cloudId')
          
          if [ "$CLOUD_ID" = "null" ] || [ -z "$CLOUD_ID" ]; then
            echo "Failed to get Cloud ID"
            echo "Response: $RESPONSE"
            exit 1
          fi
          
          echo "Successfully retrieved Cloud ID: $CLOUD_ID"
          echo "cloud_id=$CLOUD_ID" >> $GITHUB_OUTPUT

      - name: Get Jira OAuth Token
        id: jira-auth
        run: |
          # OAuth 2.0 2LO (2-legged OAuth) token generation
          RESPONSE=$(curl -s -X POST https://api.atlassian.com/oauth/token \
            -H "Content-Type: application/json" \
            -d '{
              "audience": "api.atlassian.com",
              "grant_type": "client_credentials",
              "client_id": "${{ secrets.JIRA_CLIENT_ID }}",
              "client_secret": "${{ secrets.JIRA_CLIENT_SECRET }}",
              "scope": "write:servicedesk-request"
            }')
          
          ACCESS_TOKEN=$(echo $RESPONSE | jq -r '.access_token')
          
          if [ "$ACCESS_TOKEN" = "null" ] || [ -z "$ACCESS_TOKEN" ]; then
            echo "Failed to get access token"
            echo "Response: $RESPONSE"
            exit 1
          fi
          
          echo "::add-mask::$ACCESS_TOKEN"
          echo "access_token=$ACCESS_TOKEN" >> $GITHUB_OUTPUT

      - name: Get Service Desk ID from Project
        id: service-desk-id
        run: |
          # Get project details to find the service desk ID
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            "https://api.atlassian.com/ex/jira/${{ steps.jira-cloud-id.outputs.cloud_id }}/rest/api/3/project/${{ env.SERVICE_DESK_PROJECT_KEY }}" \
            -H "Authorization: Bearer ${{ steps.jira-auth.outputs.access_token }}" \
            -H "Accept: application/json")
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            PROJECT_ID=$(echo "$BODY" | jq -r '.id')
            echo "Successfully retrieved project ID: $PROJECT_ID"
            echo "service_desk_id=$PROJECT_ID" >> $GITHUB_OUTPUT
          else
            echo "Failed to get project details"
            echo "Response: $BODY"
            exit 1
          fi

      - name: Create GitHub Deployment
        id: deployment
        uses: chrnorm/deployment-action@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          environment: production
          description: "[Automated Change] - Deployment for release ${{ steps.release-info.outputs.release_tag }}"

      - name: Create Jira Service Management Customer Request
        id: jira-ticket
        run: |
          # Prepare the request body
          REQUEST_BODY=$(cat <<EOF
          {
            "serviceDeskId": "${{ steps.service-desk-id.outputs.service_desk_id }}",
            "requestTypeId": "10498",
            "requestFieldValues": {
              "summary": "[Automated Change] - Deployment for release ${{ steps.release-info.outputs.release_tag }}",
              "description": {
                "type": "doc",
                "version": 1,
                "content": [
                  {
                    "type": "paragraph",
                    "content": [
                      {
                        "type": "text",
                        "text": "Automated deployment request for release ${{ steps.release-info.outputs.release_tag }}"
                      }
                    ]
                  },
                  {
                    "type": "paragraph",
                    "content": [
                      {
                        "type": "text",
                        "text": "Release URL: ${{ steps.release-info.outputs.release_url }}"
                      }
                    ]
                  },
                  {
                    "type": "paragraph",
                    "content": [
                      {
                        "type": "text",
                        "text": "Deployment ID: ${{ steps.deployment.outputs.deployment_id }}"
                      }
                    ]
                  },
                  {
                    "type": "paragraph",
                    "content": [
                      {
                        "type": "text",
                        "text": "Repository: ${{ github.repository }}"
                      }
                    ]
                  }
                ]
              },
              "customfield_10496": "${{ steps.deployment.outputs.deployment_id }}",
              "customfield_10499": "https://github.com/${{ github.repository }}/deployments/${{ steps.deployment.outputs.deployment_id }}",
              "customfield_10498": "${{ steps.release-info.outputs.release_url }}",
              "customfield_10497": "${{ env.SERVICE_ID }}"
            }
          }
          EOF
          )

          # Create the customer request
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "https://api.atlassian.com/ex/jira/${{ steps.jira-cloud-id.outputs.cloud_id }}/rest/servicedeskapi/request" \
            -H "Authorization: Bearer ${{ steps.jira-auth.outputs.access_token }}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -d "$REQUEST_BODY")
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          
          echo "HTTP Status Code: $HTTP_CODE"
          echo "Response Body: $BODY"
          
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            ISSUE_KEY=$(echo "$BODY" | jq -r '.issueKey')
            echo "Successfully created Jira ticket: $ISSUE_KEY"
            echo "issue_key=$ISSUE_KEY" >> $GITHUB_OUTPUT
          else
            echo "Failed to create Jira ticket"
            echo "Response: $BODY"
            exit 1
          fi
      - name: Summary
        if: always()
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Release**: ${{ steps.release-info.outputs.release_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Release URL**: ${{ steps.release-info.outputs.release_url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployment ID**: ${{ steps.deployment.outputs.deployment_id }}" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ steps.jira-ticket.outputs.issue_key }}" ]; then
            echo "- **Jira Ticket**: ${{ steps.jira-ticket.outputs.issue_key }}" >> $GITHUB_STEP_SUMMARY
          fi
